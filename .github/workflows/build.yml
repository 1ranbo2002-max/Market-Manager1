
name: Build Supermarket APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q MarketManagerAndroid_Project.zip -d source

      - name: Build APK
        run: gradle --no-daemon -p source/MarketManagerAndroid assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Supermarket-APK
          path: source/MarketManagerAndroid/app/build/outputs/apk/debug/app-debug.apk
          
